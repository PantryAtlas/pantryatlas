<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pa-dial-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A73E8"/>
      <stop offset="0.5" stop-color="#9B72CB"/>
      <stop offset="1" stop-color="#D96570"/>
    </linearGradient>
  </defs>
  <!-- track ring -->
  <circle cx="32" cy="32" r="23" stroke="#1A1B22" stroke-opacity="0.16" stroke-width="5"/>
  <!-- gradient coverage arc (~68%) -->
  <circle cx="32" cy="32" r="23" stroke="url(#pa-dial-grad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="98.27 144.51" transform="rotate(-90 32 32)"/>
  <!-- head dot at arc tip -->
  <circle cx="32" cy="9" r="3.6" fill="url(#pa-dial-grad)"/>
  <!-- bowl nested at center -->
  <path d="M21 31 a11 11 0 0 0 22 0 Z" fill="#1A1B22"/>
  <ellipse cx="32" cy="31" rx="11" ry="2.6" fill="#1A1B22" opacity="0.4"/>
</svg>
