<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F6"/>
      <stop offset="100%" stop-color="#FCE8E4"/>
    </linearGradient>
    <radialGradient id="blob" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#B85C38"/>
      <stop offset="60%" stop-color="#E89B62"/>
      <stop offset="100%" stop-color="#F5DDB8"/>
    </radialGradient>
    <radialGradient id="vessel" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#FFE8DB"/>
      <stop offset="55%" stop-color="#FFDBCD"/>
      <stop offset="100%" stop-color="#F2E2A8"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="320" fill="url(#blob)" opacity="0.35"/>

  <!-- vessel illustration -->
  <g transform="translate(120, 150)">
    <circle cx="150" cy="150" r="150" fill="url(#vessel)"/>
    <rect x="86" y="110" width="120" height="84" rx="12" fill="#8B3A1F"/>
    <circle cx="106" cy="132" r="6" fill="#F5DDB8"/><circle cx="126" cy="132" r="6" fill="#F5DDB8"/>
    <circle cx="146" cy="132" r="6" fill="#F5DDB8"/><circle cx="166" cy="132" r="6" fill="#F5DDB8"/>
    <rect x="100" y="156" width="88" height="12" rx="6" fill="#E89B62"/>
    <circle cx="216" cy="178" r="8" fill="#2E9E5B"/>
    <circle cx="230" cy="120" r="26" fill="#D8743F"/>
    <ellipse cx="246" cy="172" rx="30" ry="16" fill="#7FB069"/>
  </g>

  <!-- text -->
  <text x="500" y="270" font-family="system-ui, sans-serif" font-size="68" font-weight="700" fill="#211916">PantryAtlas</text>
  <text x="500" y="340" font-family="system-ui, sans-serif" font-size="38" font-weight="600" fill="#8B3A1F">Your kitchen's smart pantry.</text>
  <text x="500" y="392" font-family="system-ui, sans-serif" font-size="38" font-weight="600" fill="#8B3A1F">Lives in your kitchen.</text>
  <text x="500" y="452" font-family="system-ui, sans-serif" font-size="26" font-weight="400" fill="#53433F">Free · Open source · Runs on a small computer</text>
  <text x="500" y="488" font-family="system-ui, sans-serif" font-size="26" font-weight="400" fill="#53433F">in your kitchen.</text>
</svg>
