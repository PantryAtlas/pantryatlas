[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pantryatlas"
version = "0.2.0"
description = "PantryAtlas: multilingual embeddings, sqlite-vec storage, Gemma 4 runner, SLERP math, pantry primitives, and Pi-side ops — one package, sub-products as submodules. Domain: https://pantryatlas.org"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Craig Merry", email = "craigm26@gmail.com"}
]
keywords = [
    "embeddings",
    "multilingual",
    "vector-storage",
    "sqlite",
    "recipe",
    "ingredient",
    "Gemma",
    "LLM",
    "Raspberry Pi"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "sqlite-vec>=0.1.6",
    "rapidfuzz>=3.10",
    "pyarrow>=18.0",
    "jsonschema>=4.23",
    "psutil>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
    "tokenizers>=0.20",
    "huggingface_hub>=0.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/pantryatlas/pantryatlas"
Documentation = "https://github.com/pantryatlas/pantryatlas/blob/main/README.md"
Repository = "https://github.com/pantryatlas/pantryatlas.git"
Issues = "https://github.com/pantryatlas/pantryatlas/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pantryatlas*"]

[tool.setuptools.package-data]
pantryatlas = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Dev-only screenshot/mock backend with long canned recipe-data strings.
"web/mock_backend.py" = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not pi_integration'"
markers = [
    "pi_integration: marks tests as Pi integration tests (deselect with '-m \"not pi_integration\"')",
]

[tool.coverage.run]
source = ["pantryatlas"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
